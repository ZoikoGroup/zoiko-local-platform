services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoiko
      POSTGRES_PASSWORD: zoiko
      POSTGRES_DB: zoiko_local
    ports:
      - "5433:5432"  # host 5433 -> avoids conflict with other local Postgres containers on 5432
    volumes:
      - zoiko_pgdata:/var/lib/postgresql/data

volumes:
  zoiko_pgdata:
