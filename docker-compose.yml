services:
  postgres:
    # pgvector/pgvector:pg16 - same as postgres:16, plus the pgvector
    # extension binaries (needed for semantic search over AI summaries).
    # Matches Neon, which has pgvector available natively.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoiko
      POSTGRES_PASSWORD: zoiko
      POSTGRES_DB: zoiko_local
    ports:
      - "5435:5432"  # host 5435 -> avoids conflict with native PostgreSQL 13/16/18 Windows services
                      # already bound to 5432/5433/5434 on this dev machine (5433 in particular is
                      # postgresql-x64-16 - confirmed live: it silently wins the port over Docker's
                      # forwarding, so any client connecting to host 5433 was actually talking to
                      # that native install, not this container, with completely different credentials)
    volumes:
      - zoiko_pgdata:/var/lib/postgresql/data

  # Event bus (backend/app/events/, integrations/eventbus/kafka.py). Single-node
  # KRaft mode (broker+controller combined) - no Zookeeper needed. Approved as
  # an exception to the original "no Kafka" Phase 1 scope - see CLAUDE.md.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9095:9094"  # host 9095 -> avoids conflict with an unrelated project's broker already on 9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two advertised listeners, not one - Kafka's protocol has clients
      # reconnect to whatever address the broker ADVERTISES after the
      # initial bootstrap, not just the one they dialed in on. A single
      # "localhost:9095" advertisement (this service's original config)
      # works for the host machine but breaks for any OTHER container on
      # this network (e.g. the `backend` service) - `localhost` inside a
      # container means the container itself, not the Kafka container -
      # so PLAINTEXT_INTERNAL (kafka:9092) is what sibling containers use,
      # and PLAINTEXT_HOST (localhost:9095) is what the host machine's
      # native processes (tests, dev server) use.
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      CLUSTER_ID: ZoikoLocalKRaftClusterID1
      # Single-broker dev setup - the defaults (replication factor 3) can
      # never be satisfied with 1 broker, which silently hangs every
      # consumer group's partition assignment forever (producers still work,
      # since they don't need the __consumer_offsets coordination topic).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - zoiko_kafka_data:/var/lib/kafka/data

  # Shared rate-limit counter store (backend/app/core/rate_limit.py) - the
  # backend runs WEB_CONCURRENCY=4 uvicorn worker processes, and slowapi's
  # default in-memory storage is per-process, so without this every
  # rate-limited route (login, signup, MFA, video, public API) actually
  # tolerates up to 4x its configured limit before anything blocks - each
  # worker counts hits independently. Redis gives every worker (and, if this
  # ever runs as multiple instances, every instance) one shared counter.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"  # host 6381 -> 6379 and 6380 are both already taken on this dev machine
                      # (a native/other-project Redis on 6379, and the separate zoikonex-redis
                      # mock-services container on 6380 - confirmed live, same class of collision
                      # as the postgres 5433 note above). Only matters for reaching Redis from the
                      # HOST (e.g. a natively-run uvicorn, redis-cli) - the backend container talks
                      # to it via the internal Docker network as redis:6379 regardless of this.
    volumes:
      - zoiko_redis_data:/data

  # No consumer service defined here - run the event-log consumer
  # (backend/app/events/consumer.py) locally alongside this broker with:
  #   cd backend && python -m app.events.consumer
  # It writes every zoiko.numbers/zoiko.calls/zoiko.notifications/zoiko.video
  # message into the event_log table, deduped on the envelope's event_id.

  # FastAPI app (backend/Dockerfile) - runs `alembic upgrade head` then
  # uvicorn on every start (see Dockerfile's CMD). env_file loads the same
  # repo-root .env the app reads natively (Settings.env_file="../.env" from
  # inside backend/), except KAFKA_BOOTSTRAP_SERVERS/REDIS_URL below, which
  # must override that file's "localhost:9095"/"localhost:6380" - inside
  # this container, "localhost" means the container itself, not the host
  # machine, so Kafka and Redis have to be addressed by their Compose
  # service names and internal ports instead.
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - kafka
      - redis

  # Self-hosted media plane (backend/app/integrations/video/livekit.py) -
  # Architecture doc Phase 4 "owned media components". LiveKit Cloud (the
  # current LIVEKIT_URL in .env) and this container run the exact same
  # open-source LiveKit server software and speak the identical client API,
  # so no application code changes are needed to use this - only pointing
  # LIVEKIT_URL/LIVEKIT_API_KEY/LIVEKIT_API_SECRET at it instead of Cloud
  # (see the LIVEKIT_SELF_HOSTED_* vars added to .env). NOT switched over
  # by default - LiveKit Cloud stays the active configuration (already
  # tested end-to-end) until that's a deliberate decision, same posture as
  # every other not-yet-activated integration in this codebase.
  #
  # Single-node, no Redis - LiveKit only needs Redis for multi-node
  # clustering (matching this repo's "single-node Kafka, no Zookeeper"
  # minimalism). RTC media uses a real UDP port range (not just the
  # HTTP/WS signaling port) for actual WebRTC connectivity, plus TCP 7881
  # as a fallback for networks that block UDP - both required for the
  # doc's "TURN/STUN coverage... failed NAT traversal is a launch blocker"
  # requirement to mean anything self-hosted.
  # Not using `--dev` mode: it defaults to the well-known "devkey"/"secret"
  # keypair and its documented behavior around a caller-supplied LIVEKIT_KEYS
  # is inconsistent - LIVEKIT_CONFIG (the env binding of --config-body, full
  # server config as YAML) is LiveKit's own recommended way to pin real
  # custom credentials outside of a mounted config file.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # Real deployment needs a much wider RTC port range for concurrent-call
    # headroom - narrowed to 100 ports here so `docker compose up` doesn't
    # try to publish tens of thousands of ports on a dev machine. Widen
    # port_range_start/end (and the matching port mapping below) before
    # this goes anywhere near production traffic.
    environment:
      # Substituted from the repo-root .env (gitignored) at `docker compose`
      # parse time - never hardcode real keys directly in this tracked file.
      #
      # turn.enabled adds LiveKit's own embedded TURN relay on plain UDP
      # (no cert needed) - a real improvement over having no TURN at all,
      # covering most consumer-NAT cases. It's NOT sufficient for the
      # doc's "failed NAT traversal is a launch blocker" bar on its own:
      # callers behind a symmetric NAT or a firewall that blocks arbitrary
      # UDP (common on corporate networks) need TURN-over-TLS on port 443,
      # which LiveKit also supports (`tls_port` + `domain` +
      # `external_tls: true`) but requires a real domain name and a valid
      # TLS certificate for that domain - neither of which exist for this
      # dev setup. Add those three keys once this self-hosted option is
      # actually deployed somewhere with a real domain, before relying on
      # it for callers on hostile networks.
      # Windows/Docker Desktop dev machine gotcha: Hyper-V dynamically
      # reserves a range of ephemeral ports (`netsh interface ipv4 show
      # excludedportrange protocol=udp`) that on this host happens to
      # cover 50000-50159 - directly colliding with LiveKit's original
      # 50000-50100 RTC range and making `docker compose up` fail with
      # "bind: An attempt was made to access a socket in a way forbidden
      # by its access permissions." Moved to 40000-40100, which isn't in
      # any excluded range on this host. Not a LiveKit or app issue -
      # re-check the exclusion list if this ever collides again.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 40000
          port_range_end: 40100
          use_external_ip: true
        turn:
          enabled: true
          udp_port: 3478
          # Defaults to a much wider range - narrowed for the same reason
          # as rtc.port_range_start/end above (a manageable docker-compose
          # port mapping on a dev machine, not tens of thousands of ports).
          # Widen before any real concurrent-call load relies on this.
          relay_range_start: 30000
          relay_range_end: 30100
        keys:
          ${LIVEKIT_SELF_HOSTED_API_KEY}: ${LIVEKIT_SELF_HOSTED_API_SECRET}
    ports:
      - "7880:7880"                     # HTTP/WebSocket - client signaling + server API
      - "7881:7881"                     # TCP fallback for restrictive/UDP-blocking networks
      - "40000-40100:40000-40100/udp"   # RTC media (WebRTC)
      - "3478:3478/udp"                 # Embedded TURN control channel
      - "30000-30100:30000-30100/udp"   # TURN relay data (see turn.relay_range_start/end above)

volumes:
  zoiko_pgdata:
  zoiko_kafka_data:
  zoiko_redis_data:
