services:
  postgres:
    # pgvector/pgvector:pg16 - same as postgres:16, plus the pgvector
    # extension binaries (needed for semantic search over AI summaries).
    # Matches Neon, which has pgvector available natively.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoiko
      POSTGRES_PASSWORD: zoiko
      POSTGRES_DB: zoiko_local
    ports:
      - "5433:5432"  # host 5433 -> avoids conflict with other local Postgres containers on 5432
    volumes:
      - zoiko_pgdata:/var/lib/postgresql/data

  # Event bus (backend/app/events/, integrations/eventbus/kafka.py). Single-node
  # KRaft mode (broker+controller combined) - no Zookeeper needed. Approved as
  # an exception to the original "no Kafka" Phase 1 scope - see CLAUDE.md.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9095:9092"  # host 9095 -> avoids conflict with an unrelated project's broker already on 9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ZoikoLocalKRaftClusterID1
      # Single-broker dev setup - the defaults (replication factor 3) can
      # never be satisfied with 1 broker, which silently hangs every
      # consumer group's partition assignment forever (producers still work,
      # since they don't need the __consumer_offsets coordination topic).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - zoiko_kafka_data:/var/lib/kafka/data

  # No consumer service defined here - the backend isn't containerized yet.
  # Run the event-log consumer (backend/app/events/consumer.py) locally
  # alongside this broker with:
  #   cd backend && python -m app.events.consumer
  # It writes every zoiko.numbers/zoiko.calls/zoiko.notifications/zoiko.video
  # message into the event_log table, deduped on the envelope's event_id.

volumes:
  zoiko_pgdata:
  zoiko_kafka_data:
