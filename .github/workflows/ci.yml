name: CI

on:
  push:
    branches: ["main", "venky", "anil", "merge", "dev", "anilupdated"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg16, not plain postgres:16 - the semantic
        # search migration runs `CREATE EXTENSION vector`, which only
        # exists on an image that ships the extension binaries. Must match
        # docker-compose.yml's local dev image for the same reason.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zoiko
          POSTGRES_PASSWORD: zoiko
          POSTGRES_DB: zoiko_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zoiko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://zoiko:zoiko@localhost:5433/zoiko_local
      JWT_SECRET_KEY: ci-only-secret-not-used-outside-this-workflow
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: alembic upgrade head

      - run: alembic check

      # Excludes tests marked `live` - those call real Groq/LiveKit and need
      # real credentials this workflow deliberately doesn't have (see
      # backend/pytest.ini). Run them locally, or wire real provider secrets
      # into this job later if full live coverage in CI becomes worth the
      # cost/security tradeoff.
      - run: pytest -m "not live"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.invalid

  # Deploys backend/Dockerfile to Render (render.yaml) only after both jobs
  # above actually pass - deliberately NOT relying on Render's own
  # auto-deploy-on-push, which would deploy a commit regardless of whether
  # its tests passed (a race between "push landed" and "CI finished").
  # Requires a repo secret RENDER_DEPLOY_HOOK_URL (Render dashboard ->
  # zoiko-local-api service -> Settings -> Deploy Hook - no Render API key
  # needed, the hook URL itself is the credential). Only fires on an actual
  # push to dev, never on a pull_request event.
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set - see this job's comment in ci.yml for where to get it"
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
