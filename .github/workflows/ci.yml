name: CI

on:
  push:
    branches: ["main", "venky", "anil", "merge", "dev", "anilupdated"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg16, not plain postgres:16 - the semantic
        # search migration runs `CREATE EXTENSION vector`, which only
        # exists on an image that ships the extension binaries. Must match
        # docker-compose.yml's local dev image for the same reason.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zoiko
          POSTGRES_PASSWORD: zoiko
          POSTGRES_DB: zoiko_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zoiko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://zoiko:zoiko@localhost:5433/zoiko_local
      JWT_SECRET_KEY: ci-only-secret-not-used-outside-this-workflow
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Production Readiness Standard §A10 "dependency/security scanning" -
      # informational for now (continue-on-error), not a hard gate: a real
      # 2026-08-13 pip-audit run against this exact requirements.txt found
      # unfixed findings in starlette/fastapi (would need a major-version
      # bump, not yet verified against this app's 270+ routes) and ecdsa
      # (no fixed version exists upstream at all - a known, maintainer-
      # acknowledged pure-Python timing-side-channel issue). Failing the
      # build on those today would just make CI permanently red with
      # nothing actionable to do about it in the same PR. Safe patch/minor
      # bumps already applied this pass: python-dotenv, python-jose,
      # python-multipart. See docs/runbooks/dependency-scanning.md.
      - run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

      - run: alembic upgrade head

      - run: alembic check

      # Excludes tests marked `live` - those call real Groq/LiveKit and need
      # real credentials this workflow deliberately doesn't have (see
      # backend/pytest.ini). Run them locally, or wire real provider secrets
      # into this job later if full live coverage in CI becomes worth the
      # cost/security tradeoff.
      - run: pytest -m "not live"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Same informational (continue-on-error) posture as the backend's
      # pip-audit step - see that step's comment. Current known findings
      # are all transitive through `next` and only fixable via a major
      # Next.js version bump outside this pass's scope - see
      # docs/runbooks/dependency-scanning.md.
      - run: npm audit --production
        continue-on-error: true

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.invalid

  # No deploy job here on purpose - Render deploys the backend itself via
  # its own Blueprint/git integration reading render.yaml + backend/
  # Dockerfile (manual deploy, not gated on this workflow), and the
  # frontend deploys separately to Vercel via its own git integration -
  # see render.yaml's own comment. This workflow only needs to prove
  # backend + frontend are each good.
