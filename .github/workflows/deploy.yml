name: Deploy Zoiko Local Platform
on:
  # Manual-only: this SSHes into a GCP server, runs real database migrations,
  # and restarts real services there. The actual live deployment for this
  # project is Render (backend) + Vercel (frontend), which deploy from their
  # own dashboards independently of this workflow. Changed from an automatic
  # trigger on every push to main so merging code here never silently fires
  # infrastructure changes against a server whose current status/relevance
  # isn't confirmed - run this deliberately (Actions tab -> this workflow ->
  # "Run workflow") only if that GCP box is actually still in use.
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e

            cd /var/www/zoiko-local-backend/app
            git pull origin main
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            alembic upgrade head
            deactivate
            sudo systemctl restart zoiko-local-backend

            cd /var/www/zoiko-local-platform/app
            git pull origin main
            cd frontend
            npm install
            npm run build
            pm2 restart zoiko-local-platform
            pm2 save
