name: Daily Reconciliation

# Commercial Billing Operating Standard doc §31 "daily and period-close
# reconciliation across Zoiko Local, ZoikoNex and each live provider" -
# backend/app/ops/scheduled_reconciliation.py already implements this (calls
# run_zoikonex_reconciliation, expire_overdue_cases, purge_expired_
# recordings, sweep_stale_video_recordings, list_due_renewals) but had no
# scheduler: Render's free tier (render.yaml, see its own comments) has no
# working Cron Jobs, so this ran zero times in production despite being
# fully built. GitHub Actions' free `schedule` trigger is the cheapest real
# fix that doesn't require a paid Render plan.
#
# One-time setup required (cannot be done via a code push - GitHub Actions
# secrets are only settable through the repo's own Settings UI or the `gh`
# CLI with a real token, neither available in the environment that wrote
# this workflow):
#   1. Repo Settings -> Secrets and variables -> Actions -> New repository
#      secret, named DATABASE_URL, value = the real Neon production
#      connection string (postgresql+psycopg2://... - same format used in
#      backend/.env locally, NOT the Render-only pooled variant unless
#      that's the same one).
#   2. That's the only secret this needs - the script only touches the
#      database directly (SessionLocal()), it doesn't call any external
#      provider API, so no Twilio/Stripe/LiveKit credentials are required
#      here.

on:
  schedule:
    # 03:00 UTC daily - after most timezones' business day has ended,
    # matching the "daily" cadence the doc calls for without a specific
    # required hour.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab to test this before waiting for the schedule

jobs:
  reconcile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m app.ops.scheduled_reconciliation
